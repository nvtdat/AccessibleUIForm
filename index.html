<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="style.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
        <title>Accessible UI Form</title>
    </head>
    
    <body class="main-content">
        <header class="header-container">
            <h1 class="header"> Accessible UI Form</h1>
            <h2 class="sub-header"> Please fill out the form below </h2>
        </header>
        <!-- Action là địa chỉ URL mà Form gửi sau khi submit-->
        <div class="form-container">
            
            <form action="/dangky" method="POST" class="form">
                <div class="form-group">
                    <label for="fullname" class="label">Full Name</label>
                    <input 
                        type="text" 
                        id="fullname" 
                        name="fullname" 
                        autocomplete="name" 
                        required class="form input"
                        placeholder="Enter your Full Name"
                        class="form input"
                    >
                </div>
                <div class="form-group">
                    <label for="email" class="label">Email</label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        autocomplete="email" 
                        required class="form input"
                        placeholder="Enter your Email"
                        class="form input"
                    >
                </div>
                <div class="form-group">
                    <label for="gender" class="label">Gender</label>
                    <select id="gender" name="gender" required class="form select">
                        <option value="">Select Gender</option>
                        <option value="male">Male</option>
                        <option value="female">Female</option>
                        <option value="other">Other</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="password" class="label">Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="password" name="password" required class="form input"> 
                        <button type="button" class="toggle-password" aria-label="Show password">
                            <i class="fa-solid fa-eye"></i>
                        </button>
                    </div>
                </div>
                <div class="form-group">
                    <label for="confirm-password" class="label">Confirm Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="confirm-password" name="confirm-password" required class="form input"> 
                        <button type="button" class="toggle-password" aria-label="Show password">
                            <i class="fa-solid fa-eye"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="submit-button">Sign Up</button>
            </form>
            <div class="progress-container">
                
                <div class="circle-progress" role="progressbar"
                    aria-label="Form completion"
                    aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
                    <svg viewBox="0 0 100 100">
                        <circle class="circle-bg" cx="50" cy="50" r="45"></circle>
                        <circle class="circle-bar" id="progress-circle" cx="50" cy="50" r="45"></circle>
                    </svg>
                    <span class="circle-text" id="progress-text" aria-hidden="true">0%</span>
                </div>
                <span class="progress-title">Form Completion</span>
                <div class="progress-note-panel">
                    <div class="progress-note">
                        <span class="progress-note-list" id="fullname-note">Full Name</span>
                        <span class="progress-note-list" id="email-note">Email</span>
                        <span class="progress-note-list" id="gender-note">Gender</span>
                        <span class="progress-note-list" id="password-note">Password</span>
                        <span class="progress-note-list" id="confirm-password-note">Confirm Password</span>
                    </div>
                </div>
            </div>
        </div>

    </body>
    <script src="script.js"></script>
</html>
